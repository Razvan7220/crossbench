# MEMORY MIXIN: Mem0 v2.0.0 cloud (MemoryClient at api.mem0.ai, v3 endpoints)
# Stack: -p online -p mem0v2_api -b locomo_original
#
# Requires: pip install "mem0ai>=2.0.0"
#          MEM0_API_KEY env var (or api_key param below)
#
# Key v2 cloud deltas from v1 cloud:
#   - MemoryClient() no longer accepts org_id / project_id at construction —
#     both are resolved from the API key server-side.
#   - search() REJECTS top-level entity kwargs (user_id / agent_id / app_id /
#     run_id) with ValueError — everything goes inside filters={...}.
#   - add() and delete_all() also take filters={...}; we use filters=
#     consistently for all three to match the v3 server convention.
#   - Endpoints moved to /v3/memories/search/ and /v3/memories/add/.
#   - Responses always in {"results": [...]} shape.

# NOTE: ``execution_mode`` / ``timeout_seconds`` intentionally NOT set
# here — see ``mem0v2_embedded.toml`` for the rationale.
[run]
tags = ["mem0v2_api"]

[system.memory]
provider = "mem0v2_api"
enabled = true
user_id = "bench_mem0v2_cloud"
retrieval_limit = 20
# api_key = "..."            # optional override, else reads MEM0_API_KEY
# host = "https://api.mem0.ai"
# agent_id = "..."           # optional scope (filters.agent_id)
# app_id = "..."             # optional scope (filters.app_id)
# run_id = "..."             # optional scope (filters.run_id) — new in v2
