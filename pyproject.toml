[project]
name = "cross-bench"
version = "0.1.0"
description = "Modular evaluation platform for coding benchmarks with memory and agent support"
requires-python = ">=3.12"
dependencies = [
    # Caps below are major-version ceilings to bound pip's backtracking
    # search space during ``pip install ".[...]"``. Without them, the
    # resolver can spend tens of minutes downloading metadata for every
    # released version of each package when a constraint conflicts with
    # the heavy ML / SDK stack pulled in by the benchmark extras. Each
    # cap is one major version above the locally-tested floor — bump
    # the floor when our code adopts new APIs, bump the ceiling only
    # when we've actually validated the next major.
    "typer>=0.12,<1",
    "python-dotenv>=1.0,<2",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "boto3>=1.34,<2",
    "aiobotocore>=2.12,<3",
    "docker>=7.0,<8",
    "httpx>=0.27,<1",
    # Hard-pinned: pip's resolver was burning ~35s per ``datasets`` candidate
    # version when backtracking on a peer constraint (likely huggingface-hub
    # or fsspec) — see build 5b46f851. ``==4.8.4`` matches the locally-tested
    # version and collapses pip's choice from 30+ candidates to one. Bump
    # only when we have a reason to and have verified the new minor doesn't
    # re-introduce backtracking.
    "datasets==4.8.4",
    "tomli>=2.0,<3",
    "tomli-w>=1.0,<2",
    "rich>=13.0,<15",
    "structlog>=24.0,<26",
    "aiofiles>=24.0,<26",
    "rapidfuzz>=3.0,<4",
    "tiktoken>=0.7,<1",                # exact token-count metric via cl100k_base, used by the engine
]

[project.optional-dependencies]
llm = [
    # Cap pip's backtracking surface: the prior ``openai>=1.30`` /
    # ``anthropic>=0.25`` floors gave the resolver ~25 + ~80 candidate
    # versions to try whenever it needed to backtrack on a peer constraint,
    # which is what timed out the orchestrator build at 30 min on commit
    # 080813f8 (``Downloading anthropic-0.70.0..0.25`` looping for ~28 min).
    # We use both APIs at a stable feature level — neither column needs
    # bleeding-edge LLM-SDK additions, so a major-version ceiling is safe.
    # Locally exercised against openai 2.24 / anthropic 0.86.
    "openai>=1.30,<3",
    "anthropic>=0.25,<1",
]
memory-mem0 = [
    # Alias for ``memory-mem0v2``. ``memory-mem0`` predates the v1/v2 split
    # and is referenced by the ``memory`` umbrella + the orchestrator image.
    # Use the explicit ``memory-mem0v1`` / ``memory-mem0v2`` extras when
    # writing new code so the version is self-documenting.
    "cross-bench[memory-mem0v2]",
]
memory-mem0v2 = [
    # Pin to 2.x — mem0v2_middleware.py is audited against ``mem0ai==2.0.0``
    # (see deviations.md § By memory system → mem0v2_embedded). The previous
    # ``>=0.1`` floor forced pip to backtrack through every 0.x, 1.x, 2.x
    # release during image build, blowing past 30 minutes of resolution.
    "mem0ai[nlp]>=2.0,<3",             # [nlp] pulls spaCy for mem0 fact deduplication
]
memory-mem0v1 = [
    # Pin to 1.x — mem0v1_middleware.py is audited against ``mem0ai==1.0.11``
    # (see deviations.md § By memory system → mem0v1_embedded / mem0v1_api).
    # The v1 and v2 packages share the same import name (``mem0``) but have
    # incompatible ``Memory.search()`` signatures (v1 takes top-level
    # ``user_id`` / ``limit``; v2 requires ``filters={"user_id": ...}`` /
    # ``top_k``). They CANNOT coexist in one environment — pip will resolve
    # to whichever pin wins, and the other middleware will fail at runtime
    # with the v2 validator error ``Top-level entity parameters frozenset(...)
    # are not supported in search()``. Install this extra in a SEPARATE
    # image / venv from ``memory-mem0v2``; ``Mem0V1EmbeddedMiddleware``
    # checks the installed version at init and raises if v2 is present.
    "mem0ai>=1.0,<2",
]
memory-zep = [
    # v2.x SDK (April 2025+). The v0.x SDK is upstream-deprecated AND
    # carried a hard ``httpx>=0.24,<0.25`` pin that conflicted with the
    # rest of our stack (openai / anthropic / mem0ai all need
    # httpx>=0.27). zep-python 2.x drops that constraint and uses a
    # redesigned API (``AsyncZep`` client + ``memory.search_sessions`` /
    # ``memory.add``). zep_middleware.py was migrated on 2026-05-21.
    "zep-python>=2.0,<3",
]
memory-letta = [
    # official SDK (NOT the deprecated ``letta`` server pkg). Pin to 1.x
    # because the prior ``>=0.1`` floor pulled pip through ~230 patch
    # releases of the 0.1.x line during image-build resolution (each
    # candidate ~10s to fetch metadata → 30+ min total backtracking).
    # Locally exercised against 1.10.1.
    "letta-client>=1.10,<2",
]
memory-memos = [
    "MemoryOS>=2.0,<3",                # MemTensor/MemOS — pip pkg name is MemoryOS
]
memory-evermemos = [
    "evermemos>=0.3.13,<1",            # Official EverMind-AI cloud SDK (https://api.evermind.ai, /api/v0/)
    "httpx>=0.27,<1",                  # Used by the SDK and by evermemos_embedded for the OpenAI client
]
memory = [
    "cross-bench[memory-mem0,memory-zep,memory-letta,memory-memos,memory-evermemos]",
]
embedding = [
    "sentence-transformers>=3.0,<6",
]
benchmark-repobench = [
    "tiktoken>=0.7,<1",                # token-budget truncation in the RepoBench prompt
    "codebleu>=0.6,<1",                # optional CodeBLEU metric (matches upstream)
]
benchmark-swebench = [
    "swebench>=4.1,<5",                # official harness: TestSpec, eval_script, log parsers, grading
]
benchmark-humaneval = [
    "human-eval>=1.0.3,<2",            # openai/human-eval: read_problems, estimate_pass_at_k
]
benchmark-evalplus = [
    "evalplus>=0.3,<1",                # HumanEval+ & MBPP+: sanitize, untrusted_check, groundtruth
]
benchmark-livecodebench = [
    "nvidia-livecodebench>=26.0,<27",  # imports as ``livecodebench`` — NVIDIA's packaged fork of LiveCodeBench
]
benchmark-terminalbench = [
    # 0.2.18 is the latest version published to PyPI (no 0.3.x release exists
    # at audit time). The adapter's load/eval paths
    # (terminal_bench.dataset.Dataset, .handlers.trial_handler.Task /
    # TaskPaths, .parsers.parser_factory.ParserFactory,
    # .parsers.base_parser.UnitTestStatus) are stable in 0.2.18 — see
    # ``tests/benchmarks/test_terminalbench.py`` which runs green against it.
    "terminal-bench>=0.2.18",
    "pyyaml>=6.0",                     # parse docker-compose.yaml to pick task image
]
benchmark-locomo = [
    "nltk>=3.8,<4",                    # PorterStemmer for upstream-faithful F1 metric
    "regex>=2022.10.31",               # LoCoMo upstream uses `regex.sub` in normalize_answer; matches upstream's requirements.txt pin
]
seal = [
    # Scale AI's customized SWE-agent — the canonical scaffold for the
    # public SWE-bench Pro leaderboard. CrossBench's SEAL scaffold
    # (``execution/scaffolds/seal.py``) subprocess-invokes ``python -m
    # sweagent`` to produce patches; this extra makes that import work.
    #
    # **Submodule prerequisite.** The vendored copy lives at
    # ``third_party/swe_agent`` (pinned via ``.gitmodules`` to
    # scaleapi/SWE-agent@scale-customizations). Initialise once with
    # ``git submodule update --init --recursive`` BEFORE running
    # ``pip install -e .[seal]`` — pip resolves the ``file:``-URL below
    # against the current source tree, so the submodule directory must
    # be populated or the install fails with "directory does not exist".
    #
    # **Why not a PyPI pin.** Scale has not published the
    # ``scale-customizations`` fork to PyPI. The file-URL keeps the
    # exact upstream snapshot pinned by .gitmodules — bumping the
    # submodule SHA + re-running ``pip install -e .[seal]`` picks up
    # the new revision. If Scale ever publishes (e.g.
    # ``scaleapi-sweagent``), swap this line for a normal version
    # pin and remove the submodule + the ``CROSS_BENCH_REPO_ROOT``
    # resolution dance in ``execution/scaffolds/seal.py``.
    #
    # **Editable mode.** This installs sweagent as a snapshot (not
    # editable). That's intentional — the submodule is vendored
    # upstream code, not something we edit in this repo. Editable
    # would risk silent drift between what's tested and what's
    # installed.
    #
    # See deviations.md S23.
    "sweagent @ file:./third_party/swe_agent",
]
# Umbrella for every benchmark adapter's third-party dependency. The
# orchestrator Docker image installs this so any benchmark we ship can
# be dispatched without an image rebuild. Adding a new benchmark with a
# third-party package: declare a ``benchmark-<name>`` extra above AND
# add it here. Locked by
# ``tests/test_packaging.py::test_dockerfile_installs_all_declared_extras``.
benchmark = [
    "cross-bench[benchmark-locomo,benchmark-swebench,benchmark-repobench,benchmark-humaneval,benchmark-evalplus,benchmark-livecodebench,benchmark-terminalbench]",
]
# Pulumi pins are EXACT, not floor-only.
#
# The stack state records the provider version it was applied with
# (currently ``default_7_30_0``). A fresh ``pip install`` that
# resolves to a different version will trigger a provider migration
# on the next ``pulumi up``, which has historically surfaced as
# either ``TypeError: Object of type Output is not JSON serializable``
# (7.x stricter Output handling vs 6.x) or AmazonECSManaged-tag
# drift. The pyproject pin is the only place that prevents this on
# a fresh checkout — bump these in lockstep with a deliberate
# ``pulumi up`` so the state is migrated to the new provider in
# the same commit that bumps the pin.
infra = [
    "pulumi==3.242.0",
    "pulumi-aws==7.30.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
all = ["cross-bench[llm,memory,embedding,infra,dev]"]

[project.scripts]
cross-bench = "cross_bench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Required for the ``seal`` extra's ``sweagent @ file:./third_party/swe_agent``
# direct-URL reference (PEP 508 direct-reference form). Hatchling rejects
# direct-reference deps by default as a security gate — operators must
# opt in. Discovered the hard way: CodeBuild ``cross-bench-dev-build:4fccf19f``
# failed with ``ValueError: Dependency #1 of option seal ... cannot be a
# direct reference unless field tool.hatch.metadata.allow-direct-references
# is set to true``. The local ``pip install -e .[seal]`` test for PR #60
# only exercised ``tomllib.loads(...)`` (TOML parse), not an actual hatch
# build, so the gate didn't fire until CodeBuild's clean-build pip install.
#
# Scope of this opt-in: applies to every entry across every extra. Today
# only ``seal`` uses a direct reference; if a future extra adds another,
# it just works without revisiting this knob. The "don't accept random
# URLs in transitive deps" intent the flag normally protects against is
# still enforced by ``constraints.txt`` — every transitive pin lives there.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/cross_bench"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
